<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUSAIゼミな～る｜被災地と未災地の高校生をつなぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B39;
    --ink-soft:#5B6570;
    --paper:#F3EEE4;
    --paper-deep:#E9E1D2;
    --river:#3E6E8E;
    --river-deep:#2A4E66;
    --ember:#B5482A;
    --rice:#6E8B4E;
    --gold:#C79A3D;
    --line:rgba(28,43,57,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:400;
    line-height:1.9;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  h1,h2,h3,.serif{ font-family:'Shippori Mincho', serif; }
  .eyebrow{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    letter-spacing:0.28em;
    font-weight:700;
    color:var(--river);
    text-transform:uppercase;
  }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 28px; }
  section{ position:relative; }

  /* focus visibility */
  a:focus-visible, button:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }

  /* ===== NAV ===== */
  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(243,238,228,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1080px; margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{
    font-family:'Shippori Mincho', serif;
    font-size:18px; font-weight:700; color:var(--ink);
    display:flex; align-items:center; gap:9px;
  }
  .brand-mark{
    width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold), var(--ember) 70%);
    flex-shrink:0;
  }
  nav.links{ display:flex; gap:26px; }
  nav.links a{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px; font-weight:500; letter-spacing:0.03em;
    text-decoration:none; color:var(--ink-soft);
    position:relative; padding-bottom:3px;
  }
  nav.links a:hover{ color:var(--river-deep); }
  .nav-cta{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px; font-weight:700;
    background:var(--ink); color:var(--paper) !important;
    padding:9px 18px; border-radius:2px; text-decoration:none;
    letter-spacing:0.05em;
  }
  .menu-btn{ display:none; background:none; border:none; cursor:pointer; padding:6px; z-index:110; position:relative; }
  .menu-btn span{ display:block; width:22px; height:2px; background:var(--ink); margin:5px 0; transition:transform 0.25s ease, opacity 0.25s ease; }
  .menu-btn[aria-expanded="true"] span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] span:nth-child(2){ opacity:0; }
  .menu-btn[aria-expanded="true"] span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

  .mobile-panel{
    position:fixed; top:0; right:0; height:100svh; width:min(78vw, 320px);
    background:var(--ink); color:var(--paper);
    z-index:105;
    padding:100px 32px 40px;
    display:flex; flex-direction:column; gap:6px;
    transform:translateX(100%);
    transition:transform 0.32s ease;
    box-shadow:-20px 0 50px rgba(0,0,0,0.25);
  }
  .mobile-panel.open{ transform:translateX(0); }
  .mobile-panel a{
    font-family:'Shippori Mincho', serif;
    font-size:19px; font-weight:700;
    color:var(--paper); text-decoration:none;
    padding:14px 0; border-bottom:1px solid rgba(243,238,228,0.14);
  }
  .mobile-panel .nav-cta{
    margin-top:22px; text-align:center;
    background:var(--gold); color:var(--ink) !important;
  }
  .scrim{
    position:fixed; inset:0; background:rgba(28,43,57,0.45);
    z-index:104; opacity:0; pointer-events:none;
    transition:opacity 0.32s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  @media (max-width:820px){
    nav.links{ display:none; }
    .menu-btn{ display:block; }
    .nav-cta{ display:none; }
  }
  @media (min-width:821px){
    .mobile-panel, .scrim{ display:none; }
  }

  /* ===== HERO ===== */
  .hero{
    min-height:100svh;
    display:flex; align-items:center;
    padding:120px 0 80px;
    background:
      radial-gradient(ellipse 900px 500px at 82% -8%, rgba(62,110,142,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 100%, rgba(199,154,61,0.14), transparent 60%),
      var(--paper);
    overflow:hidden;
  }
  .hero-grid{
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
  }
  .hero-eyebrow{ margin-bottom:22px; }
  .hero h1{
    font-size:clamp(34px, 4.6vw, 58px);
    line-height:1.38;
    font-weight:800;
    color:var(--ink);
  }
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(180deg, transparent 62%, rgba(199,154,61,0.45) 62%);
  }
  .hero-lede{
    margin-top:26px;
    font-size:16px;
    color:var(--ink-soft);
    max-width:46ch;
  }
  .hero-actions{ margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn-primary{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700; font-size:14px;
    background:var(--river-deep); color:#fff;
    padding:15px 26px; text-decoration:none; border-radius:2px;
    letter-spacing:0.03em;
    transition:background 0.2s ease, transform 0.2s ease;
    display:inline-block;
  }
  .btn-primary:hover{ background:var(--ink); transform:translateY(-1px); }
  .btn-ghost{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700; font-size:14px;
    color:var(--ink); border:1px solid var(--ink);
    padding:14px 25px; text-decoration:none; border-radius:2px;
    letter-spacing:0.03em;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .btn-ghost:hover{ background:var(--ink); color:var(--paper); }

  .hero-stats{ margin-top:44px; display:flex; gap:34px; flex-wrap:wrap; }
  .stat b{ font-family:'Shippori Mincho', serif; font-size:28px; color:var(--river-deep); display:block; }
  .stat span{ font-size:12.5px; color:var(--ink-soft); }

  /* signature network diagram */
  .network-box{
    position:relative; aspect-ratio:300/460;
    background:var(--ink);
    border-radius:3px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(28,43,57,0.45);
  }
  .network-box::before{
    content:"つながりの地図";
    position:absolute; top:20px; left:22px;
    font-family:'Shippori Mincho', serif;
    color:rgba(243,238,228,0.55); font-size:13px; letter-spacing:0.08em;
    z-index:3;
  }
  .network-box svg{ width:100%; height:100%; display:block; }
  .net-line{
    fill:none; stroke:var(--gold); stroke-width:1.4;
    stroke-dasharray:6 6; opacity:0.55;
    stroke-dashoffset:1000; stroke-dasharray:1000;
    animation:draw 2.6s ease forwards;
  }
  .net-line.b{ animation-delay:0.15s; stroke:var(--river);}
  .net-line.c{ animation-delay:0.3s; }
  .net-line.d{ animation-delay:0.45s; stroke:var(--river);}
  .net-line.e{ animation-delay:0.6s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .net-node{ fill:var(--paper); }
  .net-node.origin{ fill:var(--ember); }
  .net-pulse{
    fill:none; stroke:var(--gold); stroke-width:1; opacity:0;
    animation:pulse 3.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ r:5; opacity:0.7; }
    100%{ r:26; opacity:0; }
  }
  .net-label{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:9.5px; fill:rgba(243,238,228,0.72); letter-spacing:0.02em;
  }
  .net-label.origin{ fill:var(--gold); font-weight:700; font-size:10.5px; }
  .net-label.sub{ font-size:7.8px; fill:rgba(243,238,228,0.5); font-weight:400; }
  .jp-land{ fill:rgba(243,238,228,0.09); stroke:rgba(243,238,228,0.2); stroke-width:1; }

  @media (max-width:900px){
    .hero-grid{ grid-template-columns:1fr; }
    .network-box{ order:-1; max-width:340px; margin:0 auto; }
  }

  /* ===== SECTION SHELL ===== */
  .section-pad{ padding:110px 0; }
  .section-head{ max-width:640px; margin-bottom:56px; }
  .section-head h2{ font-size:clamp(26px,3vw,36px); margin-top:14px; font-weight:700; }
  .section-head p{ margin-top:16px; color:var(--ink-soft); font-size:15.5px; }
  .divider{
    border:none; height:1px; background:var(--line); margin:0;
  }

  /* ===== ACTIVITIES (4 pillars) ===== */
  #activities{ background:var(--paper-deep); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .pillar-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); }
  .pillar-card{
    background:var(--paper-deep); padding:34px 26px;
    display:flex; flex-direction:column; gap:12px;
  }
  .pillar-num{ font-family:'Shippori Mincho', serif; font-size:13px; color:var(--gold); font-weight:700; letter-spacing:0.05em; }
  .pillar-card h4{ font-family:'Shippori Mincho', serif; font-size:18px; font-weight:700; line-height:1.5; }
  .pillar-card p{ font-size:13.5px; color:var(--ink-soft); }
  @media (max-width:820px){ .pillar-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .pillar-grid{ grid-template-columns:1fr; } }

  /* ===== CORE CONCEPT ===== */
  .core-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .core-card{
    background:var(--river-deep); color:var(--paper);
    border-radius:4px; padding:28px 22px;
    display:flex; flex-direction:column; gap:10px;
  }
  .core-icon{ font-size:26px; line-height:1; }
  .core-card h4{ font-family:'Shippori Mincho', serif; font-size:16.5px; font-weight:700; }
  .core-card p{ font-size:13px; color:rgba(243,238,228,0.82); }
  @media (max-width:820px){ .core-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .core-grid{ grid-template-columns:1fr; } }

  /* ===== KOKUTAI TIMELINE ===== */
  #kokutai-history{ background:var(--paper); }
  .kt-line{ position:relative; padding-left:2px; }
  .kt-track{
    position:absolute; left:63px; top:8px; bottom:8px; width:1px;
    background:var(--line);
  }
  .kt-row{
    position:relative; display:grid; grid-template-columns:64px 1fr; gap:30px;
    padding:22px 0;
  }
  .kt-year{ font-family:'Shippori Mincho', serif; font-size:15px; font-weight:700; color:var(--ink-soft); position:relative; z-index:2; }
  .kt-row.current .kt-year{ color:var(--ember); }
  .kt-dot{
    position:absolute; left:60px; top:26px; width:8px; height:8px; border-radius:50%;
    background:var(--river); z-index:2;
  }
  .kt-row.current .kt-dot{ background:var(--ember); box-shadow:0 0 0 4px rgba(181,72,42,0.16); }
  .kt-dot.own{ background:var(--gold); }
  .kt-place .tag-own{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:10px; font-weight:700;
    color:var(--ink); background:rgba(199,154,61,0.28); border-radius:20px; padding:2px 10px; margin-left:10px;
  }
  .kt-body{ padding-left:6px; }
  .kt-place{ font-weight:700; font-size:15.5px; }
  .kt-place .tag-current{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:10px; font-weight:700;
    color:#fff; background:var(--ember); border-radius:20px; padding:2px 10px; margin-left:10px;
  }
  .kt-desc{ color:var(--ink-soft); font-size:14px; margin-top:4px; }
  .kt-desc ul{ list-style:none; margin-top:6px; display:flex; flex-direction:column; gap:5px; }
  .kt-desc ul li{ padding-left:14px; position:relative; }
  .kt-desc ul li::before{ content:"—"; position:absolute; left:0; color:var(--gold); }

  .kt-posters{ display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
  .kt-poster{
    width:110px; background:var(--ink); border-radius:3px; overflow:hidden;
    box-shadow:0 6px 14px -6px rgba(28,43,57,0.35);
  }
  .kt-poster img{ width:100%; height:150px; object-fit:contain; background:#0f1922; display:block; }
  .kt-poster figcaption{
    font-size:10px; color:var(--ink-soft); padding:6px 7px; background:var(--paper-deep);
    font-family:'Zen Kaku Gothic New', sans-serif; line-height:1.4;
  }
  @media (max-width:600px){ .kt-poster{ width:96px; } .kt-poster img{ height:130px; } }
  @media (max-width:600px){
    .kt-track{ left:38px; } .kt-dot{ left:35px; }
    .kt-row{ grid-template-columns:40px 1fr; gap:18px; }
  }

  /* ===== ABOUT ===== */
  #about{ background:var(--paper); }
  .about-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start;
  }
  .mission-card{
    background:var(--ink); color:var(--paper);
    padding:38px 34px; border-radius:3px;
    position:relative;
  }
  .mission-card::before{
    content:"見えないつながりを、可視化する。";
    font-family:'Shippori Mincho', serif;
    font-size:20px; display:block; margin-bottom:18px;
    color:var(--gold); font-weight:700; line-height:1.6;
  }
  .mission-card p{ font-size:14.5px; color:rgba(243,238,228,0.82); }
  .about-body p{ margin-bottom:18px; color:var(--ink); font-size:15.5px; }
  .about-body p:last-child{ margin-bottom:0; }
  .about-body strong{ color:var(--river-deep); font-weight:700; }

  /* ===== ORIGIN TIMELINE ===== */
  #origin{ background:var(--ink-soft-bg, var(--paper-deep)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .origin-inner{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px; align-items:center; }
  .origin-plate{
    background:var(--river-deep); color:var(--paper);
    padding:44px 36px; border-radius:3px; position:relative;
  }
  .origin-plate .year{ font-family:'Shippori Mincho', serif; font-size:52px; font-weight:800; color:var(--gold); }
  .origin-plate .place{ font-size:14px; letter-spacing:0.1em; margin-top:6px; font-family:'Zen Kaku Gothic New', sans-serif;}
  .origin-plate p{ margin-top:22px; font-size:14px; color:rgba(243,238,228,0.85); }
  .origin-text h3{ font-size:22px; font-weight:700; margin-bottom:16px; }
  .origin-text p{ color:var(--ink-soft); font-size:15.5px; margin-bottom:14px; }

  /* ===== SCHOOLS ===== */
  #schools{ background:var(--paper); }
  .school-list{ display:flex; flex-direction:column; }
  .school-row{
    display:grid; grid-template-columns:64px 1fr 1.4fr; gap:26px;
    padding:28px 0; border-top:1px solid var(--line);
    align-items:start;
  }
  .school-row:last-child{ border-bottom:1px solid var(--line); }
  .school-node{
    width:44px; height:44px; border-radius:50%;
    background:var(--paper-deep); border:1.5px solid var(--river);
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; color:var(--river-deep); font-size:14px;
  }
  .school-row.origin .school-node{ background:var(--ember); border-color:var(--ember); color:#fff; }
  .school-name{ font-weight:700; font-size:15.5px; line-height:1.6; }
  .school-name .sub{ display:block; font-size:12.5px; color:var(--ink-soft); font-weight:400; margin-top:4px; }
  .school-focus{ color:var(--ink-soft); font-size:14.5px; }
  .school-focus b{ color:var(--ink); font-weight:700; }
  .tag-origin{
    display:inline-block; margin-top:8px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:10.5px; font-weight:700;
    color:var(--ember); border:1px solid var(--ember); border-radius:20px;
    padding:2px 10px; letter-spacing:0.05em;
  }
  @media (max-width:700px){
    .school-row{ grid-template-columns:44px 1fr; cursor:pointer; }
    .school-focus{ grid-column:2; }
    .school-name{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .school-chevron{
      flex-shrink:0; width:18px; height:18px; position:relative;
      transition:transform 0.25s ease;
    }
    .school-chevron::before, .school-chevron::after{
      content:""; position:absolute; top:50%; left:50%; width:9px; height:1.6px;
      background:var(--river-deep); border-radius:2px;
    }
    .school-chevron::before{ transform:translate(-80%,-50%) rotate(45deg); }
    .school-chevron::after{ transform:translate(-20%,-50%) rotate(-45deg); }
    .school-row.expanded .school-chevron{ transform:rotate(180deg); }
    .school-row .school-focus{
      max-height:0; overflow:hidden; opacity:0;
      transition:max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
      margin-top:0;
    }
    .school-row.expanded .school-focus{ max-height:220px; opacity:1; margin-top:12px; }
  }
  @media (min-width:701px){ .school-chevron{ display:none; } }
  .past-schools{ margin-top:44px; padding-top:36px; border-top:1px dashed var(--line); }
  .past-tags{ display:flex; flex-wrap:wrap; gap:10px; }
  .past-tag{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:20px;
    padding:8px 16px; background:var(--paper-deep);
  }

  /* ===== ARCHIVE ===== */
  #archive{ background:var(--ink); color:var(--paper); }

  /* ===== GALLERY ===== */
  #gallery{ background:var(--paper); }
  .gallery-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .gallery-item{ position:relative; border-radius:3px; overflow:hidden; background:var(--ink); }
  .gallery-item img{ width:100%; height:200px; object-fit:cover; display:block; transition:transform 0.4s ease; }
  .gallery-item:hover img{ transform:scale(1.05); }
  .gallery-item figcaption{
    position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(0deg, rgba(28,43,57,0.88), transparent);
    color:var(--paper); font-size:11.5px; padding:22px 12px 10px;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  @media (max-width:820px){ .gallery-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:480px){ .gallery-grid{ grid-template-columns:1fr; } .gallery-item img{ height:220px; } }

  #archive .eyebrow{ color:var(--gold); }
  #archive .section-head p{ color:rgba(243,238,228,0.7); }
  .archive-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:rgba(243,238,228,0.14); }
  .archive-card{
    background:var(--ink); padding:32px 28px;
    display:flex; flex-direction:column; gap:14px; min-height:230px;
  }
  .archive-card .tag{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:11px; letter-spacing:0.1em; color:var(--gold); font-weight:700; }
  .archive-card h4{ font-family:'Shippori Mincho', serif; font-size:18px; font-weight:700; line-height:1.5; }
  .archive-card p{ font-size:13.5px; color:rgba(243,238,228,0.68); margin-top:auto; }
  @media (max-width:820px){ .archive-grid{ grid-template-columns:1fr; } }

  .academic-list{ margin-top:44px; border-top:1px solid rgba(243,238,228,0.14); }
  .academic-row{
    display:grid; grid-template-columns:140px 1fr; gap:26px;
    padding:20px 0; border-bottom:1px solid rgba(243,238,228,0.14);
    align-items:baseline;
  }
  .academic-year{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:18px; color:var(--gold);
    display:flex; flex-direction:column; gap:2px;
  }
  .academic-year span{ font-family:'Zen Kaku Gothic New', sans-serif; font-size:11px; font-weight:500; color:rgba(243,238,228,0.55); }
  .academic-title{ font-size:14.5px; color:rgba(243,238,228,0.88); line-height:1.7; }
  .academic-note{ margin-top:18px; font-size:12.5px; color:rgba(243,238,228,0.55); }
  @media (max-width:600px){ .academic-row{ grid-template-columns:1fr; gap:4px; } }

  .support-block{ margin-top:56px; padding-top:36px; border-top:1px dashed rgba(243,238,228,0.2); }
